      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="620" fill="#0d1117"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- window frame -->
  <rect x="40" y="36" width="1120" height="548" rx="14" fill="#161b22" stroke="#2a3240"/>

  <!-- title bar -->
  <rect x="40" y="36" width="1120" height="46" rx="14" fill="#1c2330"/>
  <rect x="40" y="60" width="1120" height="22" fill="#1c2330"/>
  <circle cx="66" cy="59" r="6" fill="#f85149"/><circle cx="86" cy="59" r="6" fill="#d29922"/><circle cx="106" cy="59" r="6" fill="#3fb950"/>
  <text x="140" y="64" fill="#58a6ff" font-size="16" font-weight="800" letter-spacing="1.5">◎ ORAMON</text>
  <circle cx="255" cy="59" r="5" fill="#3fb950"/><text x="268" y="63" fill="#8b949e" font-size="12">접속됨 · monitor@ORCL · DBA</text>
  <text x="1090" y="63" fill="#8b949e" font-size="12">⟳ 5초</text>

