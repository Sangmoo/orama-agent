  <!-- AI 튜닝 callout -->
  <rect x="70" y="432" width="1074" height="120" rx="10" fill="#12203a" stroke="#2a4a7a"/>
  <text x="92" y="466" fill="#58a6ff" font-size="15" font-weight="700">✨ AI 튜닝 제안 (Claude API)</text>
  <text x="92" y="492" fill="#c9d5e3" font-size="13">SQL 전문 · 실행계획 · 테이블 스키마/인덱스/통계를 모아 →  진단 · 인덱스 · 쿼리 재작성 제안</text>
  <g font-family="monospace" font-size="12">
    <rect x="92" y="508" width="640" height="30" rx="6" fill="#0d1117" stroke="#2a3240"/>
    <text x="104" y="528" fill="#3fb950">CREATE INDEX ix_erp ON erp_posts (board_id, delete_flag, created_at DESC);</text>
  </g>
  <rect x="1000" y="508" width="120" height="30" rx="6" fill="#58a6ff"/>
  <text x="1060" y="528" fill="#04101f" font-size="13" font-weight="700" text-anchor="middle">💾 캐시 · 저비용</text>
</svg>
