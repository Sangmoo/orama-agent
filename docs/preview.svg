    <line x1="90" y1="300" x2="575" y2="300" stroke="#2a3240" stroke-width="0.5"/>
    <line x1="90" y1="350" x2="575" y2="350" stroke="#2a3240" stroke-width="0.5"/>
    <polygon points="90,382 150,372 210,376 270,352 330,356 390,336 450,342 510,320 575,332 575,400 90,400" fill="url(#area)"/>
    <polyline points="90,382 150,372 210,376 270,352 330,356 390,336 450,342 510,320 575,332" fill="none" stroke="#58a6ff" stroke-width="2"/>

    <rect x="619" y="234" width="525" height="180" rx="9" fill="#0d1117" stroke="#2a3240"/>
    <text x="637" y="258" fill="#8b949e" font-size="12">Average Active Sessions</text><text x="1126" y="258" fill="#bc8cff" font-size="14" font-weight="700" text-anchor="end">8.76</text>
    <line x1="639" y1="300" x2="1124" y2="300" stroke="#2a3240" stroke-width="0.5"/>
    <line x1="639" y1="350" x2="1124" y2="350" stroke="#2a3240" stroke-width="0.5"/>
    <polygon points="639,360 699,348 759,352 819,318 879,326 939,300 999,312 1059,286 1124,300 1124,400 639,400" fill="#bc8cff" fill-opacity="0.14"/>
    <polyline points="639,360 699,348 759,352 819,318 879,326 939,300 999,312 1059,286 1124,300" fill="none" stroke="#bc8cff" stroke-width="2"/>
