    <text x="86" y="172" fill="#8b949e" font-size="11">CPU</text><text x="86" y="200" fill="#e6edf3" font-size="24" font-weight="700">41%</text>

    <rect x="336" y="146" width="250" height="70" rx="9" fill="#0d1117" stroke="#2a3240"/>
    <rect x="336" y="146" width="3" height="70" fill="#58a6ff"/>
    <text x="352" y="172" fill="#8b949e" font-size="11">활성 세션</text><text x="352" y="200" fill="#e6edf3" font-size="24" font-weight="700">37</text>

    <rect x="602" y="146" width="250" height="70" rx="9" fill="#0d1117" stroke="#2a3240"/>
    <rect x="602" y="146" width="3" height="70" fill="#3fb950"/>
    <text x="618" y="172" fill="#8b949e" font-size="11">차단</text><text x="618" y="200" fill="#e6edf3" font-size="24" font-weight="700">0</text>

