    <text x="212" y="112">ASH</text>
    <text x="262" y="112">세션</text>
    <text x="320" y="112">Top SQL</text>
    <text x="400" y="112">대기이벤트</text>
    <text x="492" y="112">진행작업</text>
    <text x="570" y="112">락/데드락</text>
    <text x="662" y="112">용량</text>
    <text x="712" y="112">설정</text>
